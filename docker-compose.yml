services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sports-events
      DB_USER: sevrik
      DB_PASSWORD: root
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: sports-events
      POSTGRES_USER: sevrik
      POSTGRES_PASSWORD: root
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
  frontend:
    build: ./app/nginx
  
  proxy:
    image: nginx:1.30.6
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - fastapi
volumes:
  postgres_data:
  pgadmin_data: