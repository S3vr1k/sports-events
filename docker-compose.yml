services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sports-events
      DB_USER: sevrik
      DB_PASSWORD: root
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: sports-events
      POSTGRES_USER: sevrik
      POSTGRES_PASSWORD: Fkneirf(13362)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
volumes:
  postgres_data:
  pgadmin_data: